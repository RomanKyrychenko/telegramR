# Gated live integration tests against the real Telegram API.
#
# These never run on ordinary pushes/PRs. They run on a manual dispatch or a
# weekly schedule, and only do anything when the repository has the required
# secrets configured; otherwise every integration test skips.
#
# Required repository secrets:
#   TELEGRAMR_API_ID       - API id from my.telegram.org
#   TELEGRAMR_API_HASH     - API hash
#   TELEGRAMR_SESSION_B64  - base64 of a saved, authorised .rds session, e.g.
#                            base64 -i my_session.rds | pbcopy   (macOS)
#                            base64 -w0 my_session.rds           (Linux)
# Optional:
#   TELEGRAMR_TEST_CHANNEL - public channel username to read (default "telegram")

name: integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions: read-all

jobs:
  integration:
    runs-on: ubuntu-latest
    # Only attempt when credentials exist; skips cleanly on forks/PRs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAMR_INTEGRATION: "1"
      TELEGRAMR_API_ID: ${{ secrets.TELEGRAMR_API_ID }}
      TELEGRAMR_API_HASH: ${{ secrets.TELEGRAMR_API_HASH }}
      TELEGRAMR_SESSION_B64: ${{ secrets.TELEGRAMR_SESSION_B64 }}
      TELEGRAMR_TEST_CHANNEL: ${{ secrets.TELEGRAMR_TEST_CHANNEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat
            any::withr
          needs: check

      - name: Run integration smoke tests
        run: Rscript inst/integration/smoke.R
